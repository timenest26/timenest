<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - TimeNest</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
    <header>
        <a href="index.html" class="brand">
            <img src="logo.png" alt="Niñez Conectada" class="logo-img">
            <span class="brand-name">TimeNest</span>
        </a>
        <nav class="nav-center">
            <div class="dropdown">
                <a href="#" class="drop-btn" id="aboutBtn">NOSOTROS ▾</a>
                <div class="dropdown-content" id="aboutMenu">
                    <a href="nosotros.html">Sobre nosotros</a>
                    <a href="mision.html">Nuestra Misión</a>
                </div>
            </div>
            <a href="blog.html" style="color:#0097B2; font-weight:700;">BLOG</a>
            <a href="#">PREGUNTAS</a>
        </nav>
    </header>

    <section class="catalog-section">
        <h1 class="catalog-title">Recomendaciones</h1>
        <p class="catalog-subtitle">Consejos para un uso saludable de pantallas en la infancia</p>

        <div class="catalog-grid">
            <a href="blog1.html" class="catalog-card">
                <img src="https://images.unsplash.com/photo-1544723795-3fb6469f2f70?q=80&w=500" class="catalog-img">
                <h3 class="catalog-card-title">Convivencia Familiar</h3>
                <p class="catalog-card-desc">Sin pantallas</p>
                <span class="catalog-btn">Leer más</span>
            </a>

            <a href="blog2.html" class="catalog-card">
                <img src="https://images.unsplash.com/photo-1596464716127-f2a82984de30?q=80&w=500" class="catalog-img">
                <h3 class="catalog-card-title">Actividades Alternativas</h3>
                <p class="catalog-card-desc">Deporte y lectura</p>
                <span class="catalog-btn">Leer más</span>
            </a>

            <a href="blog3.html" class="catalog-card">
                <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?q=80&w=500" class="catalog-img">
                <h3 class="catalog-card-title">Horarios y Límites</h3>
                <p class="catalog-card-desc">Según la edad</p>
                <span class="catalog-btn">Leer más</span>
            </a>
        </div>
    </section>

<script>
const aboutBtn=document.getElementById('aboutBtn'), aboutMenu=document.getElementById('aboutMenu');
aboutBtn.onclick=(e)=>{e.preventDefault(); e.stopPropagation(); aboutMenu.classList.toggle('show'); };
document.addEventListener('click',()=>{ aboutMenu.classList.remove('show'); });
</script>
</body>
</html>
