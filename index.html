<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeNest - Plan digital enfocado en la infancia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>

    <header>
        <nav class="nav-left">
            <a href="#" class="active" data-key="home">INICIO</a>
            <div class="dropdown">
                <a href="#" class="drop-btn" data-key="about">NOSOTROS ▾</a>
                <div class="dropdown-content">
                    <a href="#" data-key="about1">Sobre nosotros</a>
                    <a href="#" data-key="about2">Nuestro equipo</a>
                    <a href="#" data-key="about3">Nuestra misión</a>
                </div>
            </div>
            <a href="#" data-key="blog">BLOG</a>
        </nav>
        <div class="logo">TimeNest</div>
        <nav class="nav-right">
            <a href="#" data-key="faq" class="faq-centered">PREGUNTAS</a>
        </nav>

        <!-- IDIOMA MOVIDO A ESQUINA DERECHA -->
        <div class="lang-dropdown" id="langCorner">
            <button class="lang-btn" id="langBtn"><img src="https://flagcdn.com/w20/es.png" width="20" alt="ES"> ES ▾</button>
            <div class="lang-menu" id="langMenu">
                <button data-lang="es"><img src="https://flagcdn.com/w20/es.png" width="20" alt="ES"> Español</button>
                <button data-lang="en"><img src="https://flagcdn.com/w20/us.png" width="20" alt="EN"> English</button>
            </div>
        </div>
    </header>

    <div class="hero-image"></div>

    <section class="hero-text">
        <h1 data-key="title">Plan digital enfocado en la infancia</h1>
        <p data-key="subtitle">El uso de pantallas afecta a los niños de primera infancia, por lo que en esta página encontrarás una ayuda para que el efecto de este sea positivo.</p>
        <div class="buttons">
            <a href="#" class="btn" data-key="btn1">MÁS INFORMACIÓN</a>
        </div>
    </section>

<script>
const translations = {
  es: {
    home: "INICIO", about: "NOSOTROS ▾", blog: "BLOG", faq: "PREGUNTAS",
    about1: "Sobre nosotros", about2: "Nuestro equipo", about3: "Nuestra misión",
    title: "Plan digital enfocado en la infancia",
    subtitle: "El uso de pantallas afecta a los niños de primera infancia, por lo que en esta página encontrarás una ayuda para que el efecto de este sea positivo.",
    btn1: "MÁS INFORMACIÓN"
  },
  en: {
    home: "HOME", about: "ABOUT ▾", blog: "BLOG", faq: "F.A.Q",
    about1: "About us", about2: "Our team", about3: "Our mission",
    title: "Digital plan focused on early childhood",
    subtitle: "Screen use affects children in early childhood, so on this page you will find help to make its effect positive.",
    btn1: "MORE INFORMATION"
  }
};

const langBtn = document.getElementById('langBtn');
const langMenu = document.getElementById('langMenu');
langBtn.onclick = (e) => { e.stopPropagation(); langMenu.classList.toggle('show'); };
document.addEventListener('click', e => {
  if (!e.target.closest('.lang-dropdown')) langMenu.classList.remove('show');
  if (!e.target.closest('.dropdown')) document.querySelectorAll('.dropdown-content').forEach(m=>m.classList.remove('show'));
});
langMenu.querySelectorAll('button').forEach(btn => {
  btn.onclick = (e) => {
    e.stopPropagation();
    const lang = btn.dataset.lang;
    langBtn.innerHTML = lang === 'es'? '<img src="https://flagcdn.com/w20/es.png" width="20"> ES ▾' : '<img src="https://flagcdn.com/w20/us.png" width="20"> EN ▾';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-key]').forEach(el => el.textContent = translations[lang][el.dataset.key]);
    langMenu.classList.remove('show');
  };
});
document.querySelector('.drop-btn').onclick = (e) => {
  e.preventDefault(); e.stopPropagation();
  document.querySelector('.dropdown-content').classList.toggle('show');
};
</script>

</body>
</html>
