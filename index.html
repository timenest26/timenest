<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeNest - Equilibrio Digital</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }

        /* 1. HEADER ARRIBA */
        header {
            background: #fff;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 36px;
            font-weight: bold;
            font-style: italic;
            color: #2c3e50;
            font-family: 'Georgia', serif;
        }
        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 25px;
            font-size: 15px;
        }
        nav a:hover { color: #3498db; }

        /* 2. BANNER GRANDE CON IMAGEN DE FONDO */
        .hero {
            background: url('https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?q=80&w=1920') no-repeat center center/cover;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
        }
        .hero::before { /* Capa oscura encima de la imagen */
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
        }
        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 700px;
            padding: 20px;
        }
        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
            font-family: 'Georgia', serif;
        }
        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }
        .btn {
            background: white;
            color: #333;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }
        .btn:hover { background: #3498db; color: white; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">TimeNest</div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Guías</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <!-- BANNER -->
    <section class="hero">
        <div class="hero-content">
            <h1>Equilibrio digital en casa</h1>
            <p>Ayuda a tus hijos a usar la tecnología sin que los use a ellos. 6 pasos prácticos para padres.</p>
            <a href="#guias" class="btn">Ver Guías</a>
        </div>
    </section>

</body>
</html>
