<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeNest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #fff; color: #333; }

        /* HEADER CENTRADO */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 40px;
            background: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 50px;
        }
        .nav-left, .nav-right {
            display: flex;
            gap: 22px;
            align-items: center;
        }
        .nav-left a, .nav-right a {
            text-decoration: none;
            color: #555;
            font-size: 13px;
            letter-spacing: 1px;
            font-weight: 500;
            white-space: nowrap;
        }
        .nav-left a.active {
            border-bottom: 2px solid #0097B2;
            padding-bottom: 4px;
            color: #0097B2;
        }
        .logo {
            font-family: 'Georgia', serif;
            font-size: 42px;
            color: #0097B2;
            letter-spacing: 0.5px;
            margin: 0 30px;
            white-space: nowrap;
        }

        /* HERO IMAGEN */
        .hero-image {
            width: 100%;
            height: 460px;
            background: url('banner.png') no-repeat center/cover;
            background-color: #e8f4f6;
        }

        /* SECCION TURQUESA OSCURO */
        .hero-text {
            background: #0097B2;
            color: #fff;
            text-align: center;
            padding: 70px 20px 80px 20px;
        }
        .hero-text h1 {
            font-family: 'Georgia', serif;
            font-size: 42px;
            font-weight: 400;
            margin-bottom: 20px;
        }
        .hero-text p {
            max-width: 750px;
            margin: 0 auto 35px auto;
            font-size: 17px;
            line-height: 1.6;
            color: #eaf6f8;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            background: #fff;
            color: #0097B2;
            padding: 14px 32px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .btn:hover { background: #e0f2f5; }

        /* RESPONSIVE CELULAR */
        @media (max-width: 768px) {
            header {
                padding: 15px 15px;
                flex-wrap: wrap;
                gap: 15px;
            }
            .logo {
                order: -1;
                width: 100%;
                text-align: center;
                font-size: 36px;
                margin: 0 0 10px 0;
            }
            .nav-left, .nav-right { gap: 14px; }
            .nav-left a, .nav-right a { font-size: 11px; }
            .hero-image { height: 280px; }
            .hero-text { padding: 45px 20px; }
            .hero-text h1 { font-size: 28px; }
            .hero-text p { font-size: 15px; }
            .btn { padding: 12px 24px; width: 100%; max-width: 280px; }
            .buttons { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav-left">
            <a href="#" class="active">HOME</a>
            <a href="#">ABOUT ▾</a>
            <a href="#">SERVICES</a>
            <a href="#">BLOG</a>
        </nav>
        <div class="logo">TimeNest</div>
        <nav class="nav-right">
            <a href="#">F.A.Q</a>
            <a href="#">BOOK A SESSION</a>
        </nav>
    </header>

    <div class="hero-image"></div>

    <section class="hero-text">
        <h1>Grow Through What You Go Through</h1>
        <p>We believe mental health is a journey, not a destination. Whether you're seeking clarity, calm, or confidence, TimeNest offers personalized support for growth and healing.</p>
        <div class="buttons">
            <a href="#" class="btn">LEARN MORE</a>
            <a href="#" class="btn">OUR SERVICES</a>
        </div>
    </section>

</body>
</html>
