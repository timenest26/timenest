<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeNest - Equilibrio Digital</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #000; } /* Fondo negro para los bordes */

        /* 1. HEADER ARRIBA */
        header {
            background: #fff;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            font-style: italic;
            color: #2c3e50;
            font-family: 'Georgia', serif;
        }
        nav {
            display: flex;
            gap: 25px;
        }
        nav a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }
        nav a:hover { color: #3498db; }

        /* 2. BANNER - AHORA SE VE COMPLETO */
        .hero {
            background: url('banner.png') no-repeat center/contain; /* CAMBIO CLAVE: contain */
            background-color: #000; /* Fondo negro si sobran bordes */
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); /* Capa más suave */
        }
        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 700px;
            padding: 20px;
        }
        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
            font-family: 'Georgia', serif;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7); /* Para que se lea mejor */
        }
        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
        }
        .btn {
            background: white;
            color: #333;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
        }
        .btn:hover { background: #3498db; color: white; }

        /* 3. RESPONSIVE PARA CELULAR - AHORA NO SE CORTA */
        @media (max-width: 768px) {
            header {
                padding: 15px 5%;
                flex-direction: column;
                gap: 12px;
            }
            .logo {
                font-size: 28px;
            }
            nav {
                gap: 15px;
            }
            nav a {
                font-size: 14px;
            }
            .hero {
                height: 250px; /* Más bajo para que no quede gigante */
                background-size: contain; /* Se asegura que se vea completa */
            }
            .hero h1 {
                font-size: 24px;
            }
            .hero p {
                font-size: 14px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">TimeNest</div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Guías</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <!-- BANNER -->
    <section class="hero">
        <div class="hero-content">
            <h1>Equilibrio digital en casa</h1>
            <p>Ayuda a tus hijos a usar la tecnología sin que los use a ellos. 6 pasos prácticos para padres.</p>
            <a href="#guias" class="btn">Ver Guías</a>
        </div>
    </section>

</body>
</html>
