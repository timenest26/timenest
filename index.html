<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeNest</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>

    <header>
        <nav class="nav-left">
            <a href="#" class="active" data-key="home">INICIO</a>
            <a href="#" data-key="about">NOSOTROS ▾</a>
            <a href="#" data-key="blog">BLOG</a>
        </nav>
        <div class="logo">TimeNest</div>
        <nav class="nav-right">
            <a href="#" data-key="faq">PREGUNTAS</a>
            <div class="lang-dropdown">
                <button class="lang-btn" id="langBtn"><img src="https://flagcdn.com/w20/es.png" width="20" alt="ES"> ES ▾</button>
                <div class="lang-menu" id="langMenu">
                    <button data-lang="es"><img src="https://flagcdn.com/w20/es.png" width="20" alt="ES"> Español</button>
                    <button data-lang="en"><img src="https://flagcdn.com/w20/us.png" width="20" alt="EN"> English</button>
                </div>
            </div>
        </nav>
    </header>

    <div class="hero-image"></div>

    <section class="hero-text">
        <h1 data-key="title">Crece a través de lo que atraviesas</h1>
        <p data-key="subtitle">Creemos que la salud mental es un viaje, no un destino. Ya sea que busques claridad, calma o confianza, TimeNest ofrece apoyo personalizado para tu crecimiento y sanación.</p>
        <div class="buttons">
            <a href="#" class="btn" data-key="btn1">MÁS INFORMACIÓN</a>
        </div>
    </section>

<script>
const translations = {
  es: {
    home: "INICIO", about: "NOSOTROS ▾", blog: "BLOG",
    faq: "PREGUNTAS",
    title: "Crece a través de lo que atraviesas",
    subtitle: "Creemos que la salud mental es un viaje, no un destino. Ya sea que busques claridad, calma o confianza, TimeNest ofrece apoyo personalizado para tu crecimiento y sanación.",
    btn1: "APRENDE MÁS", btn2: "NUESTROS SERVICIOS"
  },
  en: {
    home: "HOME", about: "ABOUT ▾", blog: "BLOG",
    faq: "F.A.Q",
    title: "Grow Through What You Go Through",
    subtitle: "We believe mental health is a journey, not a destination. Whether you're seeking clarity, calm, or confidence, TimeNest offers personalized support for growth and healing.",
    btn1: "LEARN MORE", btn2: "OUR SERVICES"
  }
};

const langBtn = document.getElementById('langBtn');
const langMenu = document.getElementById('langMenu');

langBtn.onclick = (e) => {
  e.stopPropagation();
  langMenu.classList.toggle('show');
};
document.addEventListener('click', e => {
  if (!e.target.closest('.lang-dropdown')) langMenu.classList.remove('show');
});

langMenu.querySelectorAll('button').forEach(btn => {
  btn.onclick = (e) => {
    e.stopPropagation();
    const lang = btn.getAttribute('data-lang');
    langBtn.innerHTML = lang === 'es'
    ? '<img src="https://flagcdn.com/w20/es.png" width="20" alt="ES"> ES ▾'
      : '<img src="https://flagcdn.com/w20/us.png" width="20" alt="EN"> EN ▾';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-key]').forEach(el => {
      el.textContent = translations[lang][el.getAttribute('data-key')];
    });
    langMenu.classList.remove('show');
  };
});
</script>

</body>
</html>
